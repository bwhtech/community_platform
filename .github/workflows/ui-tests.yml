name: UI

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ui-develop-community_platform-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: UI Tests

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      # Bench pins the Playwright version it installs, so key the browser cache on it
      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(grep -oP 'PLAYWRIGHT_VERSION = "\K[^"]+' ~/frappe-bench/apps/frappe/frappe/commands/testing.py)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app community_platform $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app community_platform
          bench --site test_site set-config host_name "http://test_site:8000"
          echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts
          bench build
        env:
          CI: 'Yes'

      - name: Seed Demo Data
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site execute community_platform.demo.create_demo_data

      - name: Start Bench
        working-directory: /home/runner/frappe-bench
        run: |
          # redis runs as a service; no file watching or scheduler in CI
          sed -i '/^redis/d;/^watch:/d;/^schedule:/d' Procfile
          bench start &> bench_start.log &
          curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null http://test_site:8000/api/method/ping

      - name: Run Tests
        id: ui-tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-ui-tests community_platform --headless

      - name: Upload Playwright Report
        if: always() && steps.ui-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            /home/runner/frappe-bench/apps/community_platform/playwright-report
            /home/runner/frappe-bench/apps/community_platform/test-results

      - name: Show bench output
        if: ${{ always() }}
        working-directory: /home/runner/frappe-bench
        run: |
          cat bench_start.log || true
          for f in logs/*.log; do
            echo "Printing log: $f"
            cat "$f"
          done
